<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirish · Watcher</title>
{{template "styles"}}
</head>
<body>
<div class="login card">
  <div style="font-size:40px">🚆</div>
  <h1>Watcher</h1>
  <p class="hint">Poyezdga bo'sh joy chiqishi bilan Telegram'ga xabar oling.</p>
  {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
  <form method="post" action="/login/telegram" style="margin-top:24px">
    <button class="tgbtn" type="submit">
      ✈️ Telegram orqali kirish
    </button>
  </form>
  <p class="hint" style="margin-top:16px">Yangi foydalanuvchi bo'lsangiz, akkaunt avtomatik yaratiladi.</p>
  <p class="hint" style="margin-top:24px">Biletni sotib olish rasmiy saytda amalga oshiriladi.</p>
</div>
</body>
</html>
